name: Scheduled builds
on:
  schedule:
    # 08:13 UTC (3:13am CDT, 2:13am CST) every other day. GitHub can start a schedule hours late, so this one
    # workflow runs the whole cycle in order; the stages no longer rely on being spaced apart.
    - cron: "13 08 */2 * *"
  # Manual run: the whole cycle (package intervals, then v3, v4, znver4) with these options for every build.
  # To build just one architecture, run that build's own workflow instead.
  workflow_dispatch:
    inputs:
      no_cache:
        description: 'Force a clean build (--no-cache)'
        required: false
        type: boolean
        default: false
      wipe_pkg_cache:
        description: 'Wipe the package cache before prefetch (everything is downloaded again; files already scanned clean are not rescanned)'
        required: false
        type: boolean
        default: false
      test_tag:
        description: 'Append -test to the image tag'
        required: false
        type: boolean
        default: false
      build_plasma:
        description: 'Build Plasma flavor'
        required: false
        type: boolean
        default: true
      build_gnome:
        description: 'Build GNOME flavor'
        required: false
        type: boolean
        default: true
      build_niri:
        description: 'Build Niri flavor'
        required: false
        type: boolean
        default: true
      build_cinnamon:
        description: 'Build Cinnamon flavor'
        required: false
        type: boolean
        default: true
      build_deck:
        description: 'Build Deck flavor (daily tag; promote-deck.yml makes it stable)'
        required: false
        type: boolean
        default: true
      verbose_build:
        description: 'Enable verbose build output'
        required: false
        type: boolean
        default: false

      allow_build_network:
        description: 'Give the base and flavor image builds network access (normally none: everything is prefetched)'
        required: false
        type: boolean
        default: false
      allow_critical_vulns:
        description: 'Publish even if grype finds critical vulnerabilities with a fix available, or cannot scan'
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  intervals:
    uses: ./.github/workflows/update-intervals.yml
    secrets: inherit
    permissions:
      contents: write

  # Re-running failed jobs keeps the prefetch job's earlier result, but by then the arch cleanup may have pruned or
  # wiped the cache and the cleanup job below has removed the base images. So a build only skips its own prefetch when
  # the shared prefetch ran in the same attempt; otherwise it prefetches and scans itself, like a manual build.
  # One prefetch for every arch: fills all three package caches, pulls the base images and scans everything, so the
  # builds below skip their own prefetch. An arch whose prefetch failed falls back to its build's own prefetch.
  prefetch:
    needs: intervals
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/prefetch.yml
    secrets: inherit
    permissions:
      contents: read
      packages: read
      issues: write
    with:
      wipe_pkg_cache: ${{ inputs.wipe_pkg_cache == true }}
      build_plasma: ${{ format('{0}', inputs.build_plasma) != 'false' }}
      build_gnome: ${{ format('{0}', inputs.build_gnome) != 'false' }}
      build_niri: ${{ format('{0}', inputs.build_niri) != 'false' }}
      build_cinnamon: ${{ format('{0}', inputs.build_cinnamon) != 'false' }}
      build_deck: ${{ format('{0}', inputs.build_deck) != 'false' }}
      verbose_build: ${{ inputs.verbose_build == true }}

  v3:
    needs: prefetch
    # Each stage runs once the previous one finishes, whether it passed or failed, unless the run is cancelled
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build-v3.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write
      issues: write
    with:
      no_cache: ${{ inputs.no_cache == true }}
      wipe_pkg_cache: ${{ inputs.wipe_pkg_cache == true }}
      test_tag: ${{ inputs.test_tag == true }}
      build_plasma: ${{ format('{0}', inputs.build_plasma) != 'false' }}
      build_gnome: ${{ format('{0}', inputs.build_gnome) != 'false' }}
      build_niri: ${{ format('{0}', inputs.build_niri) != 'false' }}
      build_cinnamon: ${{ format('{0}', inputs.build_cinnamon) != 'false' }}
      build_deck: ${{ format('{0}', inputs.build_deck) != 'false' }}
      verbose_build: ${{ inputs.verbose_build == true }}
      allow_build_network: ${{ inputs.allow_build_network == true }}
      allow_critical_vulns: ${{ inputs.allow_critical_vulns == true }}
      prefetched: ${{ needs.prefetch.outputs.v3 == 'true' && needs.prefetch.outputs.attempt == github.run_attempt }}

  v4:
    needs: [prefetch, v3]
    # Each stage runs once the previous one finishes, whether it passed or failed, unless the run is cancelled
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build-v4.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write
      issues: write
    with:
      no_cache: ${{ inputs.no_cache == true }}
      wipe_pkg_cache: ${{ inputs.wipe_pkg_cache == true }}
      test_tag: ${{ inputs.test_tag == true }}
      build_plasma: ${{ format('{0}', inputs.build_plasma) != 'false' }}
      build_gnome: ${{ format('{0}', inputs.build_gnome) != 'false' }}
      build_niri: ${{ format('{0}', inputs.build_niri) != 'false' }}
      build_cinnamon: ${{ format('{0}', inputs.build_cinnamon) != 'false' }}
      build_deck: ${{ format('{0}', inputs.build_deck) != 'false' }}
      verbose_build: ${{ inputs.verbose_build == true }}
      allow_build_network: ${{ inputs.allow_build_network == true }}
      allow_critical_vulns: ${{ inputs.allow_critical_vulns == true }}
      prefetched: ${{ needs.prefetch.outputs.v4 == 'true' && needs.prefetch.outputs.attempt == github.run_attempt }}

  znver4:
    needs: [prefetch, v4]
    # Each stage runs once the previous one finishes, whether it passed or failed, unless the run is cancelled
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/build-znver4.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write
      issues: write
    with:
      no_cache: ${{ inputs.no_cache == true }}
      wipe_pkg_cache: ${{ inputs.wipe_pkg_cache == true }}
      test_tag: ${{ inputs.test_tag == true }}
      build_plasma: ${{ format('{0}', inputs.build_plasma) != 'false' }}
      build_gnome: ${{ format('{0}', inputs.build_gnome) != 'false' }}
      build_niri: ${{ format('{0}', inputs.build_niri) != 'false' }}
      build_cinnamon: ${{ format('{0}', inputs.build_cinnamon) != 'false' }}
      build_deck: ${{ format('{0}', inputs.build_deck) != 'false' }}
      verbose_build: ${{ inputs.verbose_build == true }}
      allow_build_network: ${{ inputs.allow_build_network == true }}
      allow_critical_vulns: ${{ inputs.allow_critical_vulns == true }}
      prefetched: ${{ needs.prefetch.outputs.znver4 == 'true' && needs.prefetch.outputs.attempt == github.run_attempt }}

  # Remove the base images prefetch pulled once the cycle is over, whatever the builds' results
  cleanup:
    needs: [prefetch, znver4]
    if: ${{ always() && needs.prefetch.result != 'skipped' }}
    runs-on: znver4
    permissions: {}
    steps:
      - name: Remove Prefetched Base Images
        run: |
          # Untagged leftovers (build layers, replaced images) first, so they do not keep a base image in use
          podman rm -af >/dev/null 2>&1 || true
          podman system prune --force --build || true

          for image in docker.io/cachyos/cachyos-v3:latest docker.io/cachyos/cachyos-v4:latest \
            ghcr.io/bopp-os/cachyos-docker/cachyos-znver4:latest; do
            if ! podman image exists "$image"; then
              echo "$image not present, nothing to remove"
              continue
            fi
            if out=$(podman rmi "$image" 2>&1); then
              echo "Removed $image"
              continue
            fi
            # Usually a cachyos-base image the arch cleanup kept because a flavor failed, so that flavor can be re-run.
            # It is left alone; the next build's cleanup or the 72h image prune removes both.
            echo "$out"
            echo "Images built on $image:"
            podman image tree --whatrequires "$image" 2>/dev/null || true
            echo "::warning::Kept $image: still used by the images listed in this step's log (normally a cachyos-base kept for re-running a failed flavor). It goes once that base is removed."
          done

          echo "Images left:"
          podman images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | sort
          df -h /
