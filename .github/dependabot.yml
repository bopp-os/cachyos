version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: "docker"
    directory: "/.github/chunkah"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/.github/syft"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/.github/grype"
    schedule:
      interval: "weekly"
  # scripts/requirements.txt is compiled from requirements.in with hashes (pip-compile --generate-hashes)
  - package-ecosystem: "pip"
    directory: "/scripts"
    schedule:
      interval: "weekly"
