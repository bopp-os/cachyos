# Files the ClamAV prefetch scan (scripts/clamscan-prefetch.sh) skips, one POSIX extended regex per line, matched by
# clamd against the path inside its container: unpacked packages are /scan/work/pkgs/<package file name>/<path>.
# Each skipped file is listed in the job log and summary. Keep every rule as narrow as possible and say why it is safe.

# Firefox's omni.ja: Mozilla's built-in archive of browser JavaScript, CSS and translations. Scanning it takes up to
# 15 minutes per file on every Firefox update, on every arch. It comes inside the Firefox package, whose signature
# pacman checks against the CachyOS/Arch keys; the rest of the package (binaries, libraries) is still scanned.
# "firefox-[0-9]" matches the firefox package only, not firefox-i18n-* or other firefox-* packages.
^/scan/work/pkgs/firefox-[0-9][^/]*/usr/lib/firefox/(browser/)?omni\.ja$
