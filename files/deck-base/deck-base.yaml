# Slim package list for cachyos-deck-base (Containerfile.base --build-arg PACKAGE_LIST=...).
# Derived from files/base/base.yaml: handheld kernel, no printing, desktop VPN/network tools, launchers, containers
# beyond podman/distrobox or large apps (those come from Flatpak through boppos-deck). Keep this list the single place
# that says what the deck base drops, so base.yaml changes can be diffed against it.
