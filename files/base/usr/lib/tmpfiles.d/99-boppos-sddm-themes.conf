# BoppOS SDDM themes tmpfiles configuration for bootc
d /var/lib/sddm 0755 root root -
d /var/lib/sddm/themes 0755 root root -
C /var/lib/sddm/themes - - - - /usr/share/sddm/themes
# Existing installs already hold a copy with the package's mode 666; reset it at every boot (C only copies when missing).
z /var/lib/sddm/themes/noctalia/theme.conf 0644 root root -
