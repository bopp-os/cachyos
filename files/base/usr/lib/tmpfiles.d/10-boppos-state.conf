# BoppOS state in /var/lib/boppos. With bootc, /var comes from the stateroot and is only seeded from the image on
# the first deployment, so the directory is made here at every boot instead of being shipped in the image.
# first-run (written by the installer, deleted by boppos-deck when the first-run app finishes) has to be
# deletable by the first user, who is in wheel; oobe-done is written by the root oobe-helper.
# The 10- prefix keeps this entry ahead of bootc-cleanup.sh's generated 99-boppos-var-auto.conf.
d /var/lib/boppos 0775 root wheel -
