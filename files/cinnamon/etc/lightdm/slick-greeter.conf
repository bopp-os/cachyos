# LightDM Slick Greeter Configuration for BoppOS Cinnamon
# Styled with Mint-Y themes and CachyOS default wallpaper

[Greeter]
background=/usr/share/wallpapers/cachyos-wallpapers/Cachy_Topography.jpg
theme-name=Mint-Y
icon-theme=Mint-Y
font-name=Noto Sans 11
draw-user-backgrounds=false
show-hostname=true
show-power=true
show-a11y=true
show-keyboard=true
show-clock=true
show-quit=true
