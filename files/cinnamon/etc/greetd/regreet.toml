# ReGreet Configuration for BoppOS Cinnamon
# Styled with Mint-Y-Dark theme and CachyOS default wallpaper

skip_selection = false

[background]
path = "/usr/share/wallpapers/cachyos-wallpapers/Cachy_Topography.jpg"
fit = "Cover"

[GTK]
application_prefer_dark_theme = true
theme_name = "Mint-Y-Dark"
icon_theme_name = "Mint-Y"
cursor_theme_name = "Bibata-Modern-Classic"
font_name = "Noto Sans 16"

[appearance]
greeting_msg = "Welcome to BoppOS"

[commands]
reboot = ["systemctl", "reboot"]
poweroff = ["systemctl", "poweroff"]
