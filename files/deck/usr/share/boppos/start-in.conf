# Where boppos-deck's first run offers to start (Gaming Mode or Desktop). Names are .desktop files in
# /usr/share/wayland-sessions or /usr/share/xsessions, without the suffix.
# The deck image's own boppos-deck-autologin.service writes the autologin user for plasmalogin; the session choice is
# switched by steamos-session-select (gamescope-session-cachyos).
[start-in]
display-manager = plasmalogin
gaming-session = gamescope-session
desktop-session = plasma
