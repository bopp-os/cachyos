# Where boppos-deck's first run offers to start (Gaming Mode or Desktop). Names are .desktop files in
# /usr/share/wayland-sessions or /usr/share/xsessions, without the suffix. Only display-manager = sddm is implemented.
# No Gaming Mode session is installed in this image yet (no gamescope-session-steam.desktop), so gaming-session is
# left empty and the step stays hidden until one exists.
[start-in]
display-manager = sddm
gaming-session =
desktop-session = niri
